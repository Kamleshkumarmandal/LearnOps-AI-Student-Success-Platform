name: Streamlit demo checks

on:
  push:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "learnops_engine.py"
      - "requirements.txt"
      - "tests/test_learnops_engine.py"
      - "tests/test_streamlit_smoke.py"
      - ".github/workflows/streamlit-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "streamlit_app.py"
      - "learnops_engine.py"
      - "requirements.txt"
      - "tests/test_learnops_engine.py"
      - ".github/workflows/streamlit-ci.yml"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q streamlit_app.py learnops_engine.py
      - run: python -m unittest discover -s tests -p "test_*.py"
